# Configuracao da parte 1 (PDI). Todos os campos tem valor padrao em celegans_seg/config.py;
# edite aqui so o que quiser mudar. Citacoes [Aula NN, pag. P] = pagina do PDF em Estudos/PDI/Slides.

input:
  # --- Opcao A: pasta com os quadros de UMA sequencia ---------------------------------
  images: ""          # ex.: D:/zenodo/csb-1_dataset/images/24_2_1_1
  masks: ""           # opcional: D:/zenodo/csb-1_dataset/masks/24_2_1_1
  # --- Opcao B: raiz do dataset (images/<seq>, masks/<seq>) ---------------------------
  dataset_root: ""
  sequence: ""
  pattern: "*.png"
  mask_pattern: "{stem}_*.png"   # mascaras do quadro 12.png -> 12_0.png, 12_1.png, ...
  start: 0
  end: -1
  step: 1
  worms_dark: true               # campo claro (verme escuro). false para fluorescencia
  nodata_border: false           # true p/ recortes com moldura preta (Zenodo 15526615 / Annotated images)

normalize:   {gamma: 1.0, autocontrast: false}
denoise:     {method: gaussian, sigma: 1.0}       # gaussian | median | bilateral | none
background:  {method: median, n_samples: 25, percentile: 70}   # median | tophat | none. percentile 50 = mediana pura; 70 evita absorver verme parado (ver docs/EXPERIMENTOS.md)
threshold:   {method: otsu, gain: 4.0, min_threshold: 40, grow_dist: 15, grow_thr: 1.0, grow_open: 3}   # method: otsu | adaptive. grow_dist: completa o verme (cauda) com o top-hat ate N px da mascara (0 = desliga)
morphology:  {opening_radius: 1, closing_radius: 1, fill_holes: true}
labeling:    {min_area: 150, bridge_gap: 8, bridge_min_area: 150}   # min_area: 80 no sintetico, 150 no CSB-1 (912x736). bridge_gap: liga pedacos de verme partido (0 = desliga)
analysis:    {cluster_ratio: 1.5, ref_area: 0.0}  # ref_area 0 = estimada dos dados
split:       {enabled: false, marker_min_dist: 10}   # false = amontoado fica como UMA mascara (vai para a CNN); true = tenta o watershed
export:      {patch_size: 192, only_clusters: true}   # 192: cabem os amontoados grandes (128 deixava ~19 % de fora); a CNN usa o mesmo tamanho

output:
  dir: runs/last

# Ordem dos estagios. Remova "export"/"evaluate"/"visualize" para rodar mais leve.
stages: [normalize, denoise, background, threshold, morphology, labeling,
         analysis, split, refine, evaluate, export, visualize]
